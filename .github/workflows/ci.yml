on:
  push:
    branches: "master"

jobs:
  build-windows:
    runs-on: "windows-latest"
    steps:
      - name: "Setup Cmake"
        uses: "lukka/get-cmake@latest"

      - name: "Checkout code"
        uses: "actions/checkout@v7"

      - name: "Install Qt"
        uses: "jurplel/install-qt-action@v4.4.1"
        with:
          version: "~6.9.0"

      - name: "Build the executable"
        run: |
          cmake -S . -B .\build
          cmake --build .\build --config Release

      - name: "Deploy"
        run: "windeployqt.exe .\\build\\Release\\veles.exe"

      - name: "Bundle"
        uses: "actions/upload-artifact@v7"
        with:
          path: ".\\build\\Release"
          name: "veles-win64"


